<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyTodo 提醒</title>
  <link rel="stylesheet" href="./renderer/reminder.css">
</head>
<body>
  <section id="reminderRoot" class="reminder-root" role="alertdialog" aria-live="assertive" aria-labelledby="taskTitle" aria-describedby="taskDescription">
    <header class="reminder-header">
      <div class="brand">
        <img src="./MyTodo.ico" alt="" aria-hidden="true">
        <div class="brand-copy">
          <strong>MyTodo</strong>
        </div>
      </div>
      <button type="button" id="dismissButton" class="icon-button" title="关闭提醒" aria-label="关闭提醒">
        <span class="close-icon" aria-hidden="true"></span>
      </button>
    </header>

    <main class="reminder-content">
      <h1 id="taskTitle"></h1>
      <p id="taskDescription"></p>
      <div class="deadline-row">
        <span>截止时间</span>
        <time id="deadlineTime"></time>
      </div>
    </main>

    <footer class="reminder-footer">
      <span id="queueStatus" class="queue-status" hidden></span>
      <div class="reminder-actions">
        <button type="button" id="snoozeButton" class="action-button secondary">5 分钟后提醒</button>
        <button type="button" id="acknowledgeButton" class="action-button primary">知道了</button>
      </div>
    </footer>
  </section>
  <script src="./renderer/reminder.js"></script>
</body>
</html>
