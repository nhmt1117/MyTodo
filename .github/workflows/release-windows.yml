name: Publish Windows release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify tag and package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -ne $tagVersion) {
            throw "Tag ${{ github.ref_name }} does not match package version $version"
          }

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build Windows installer
        run: npm run build:win

      - name: Verify release files
        run: npm run verify:release

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "${{ github.ref_name }}"
          $asset = "dist/MyTodo-Setup-$version.exe"
          $assets = @($asset, "$asset.blockmap", "dist/latest.yml")
          $changelog = Get-Content -LiteralPath "CHANGELOG.md" -Raw
          $escapedVersion = [regex]::Escape($version)
          $pattern = "(?ms)^##\s+$escapedVersion\s+.*?\r?\n(?<notes>.*?)(?=^##\s+|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) {
            throw "CHANGELOG.md does not contain release notes for $version"
          }
          $notes = "## MyTodo $version`r`n`r`n" + $match.Groups["notes"].Value.Trim()
          $notesPath = Join-Path $env:RUNNER_TEMP "mytodo-release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          $releaseExists = gh release view $tag --json id --jq .id 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
            gh release edit $tag --title "MyTodo $version" --notes-file $notesPath
          } else {
            gh release create $tag $assets --verify-tag --title "MyTodo $version" --notes-file $notesPath
          }
