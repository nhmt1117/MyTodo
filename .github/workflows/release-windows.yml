name: Publish Windows release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag and package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version $version"
          }

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build Windows installer
        run: npm run build:win

      - name: Verify release files
        run: npm run verify:release

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "${{ github.ref_name }}"
          $asset = "dist/MyTodo-Setup-$version.exe"
          $assets = @($asset, "$asset.blockmap", "dist/latest.yml")
          $notes = @"
          ## MyTodo $version

          ### 本次修复
          - 修复 Windows 任务栏图标显示不正确的问题。
          - 安装器发现 MyTodo 正在运行时，会提示先从右下角托盘退出，并直接结束安装。
          - 修复应用内检查更新无法获取新版本的问题。

          ### 应用内更新
          - 在“设置 → 关于”可手动检查更新；应用启动后也会定时检查。
          - 发现新版本后，由你决定是否下载；下载完成后点击“重启并安装”即可升级。
          - Release 中的 `latest.yml` 和 `.blockmap` 仅供应用自动更新使用，手动安装只需下载 `.exe`。

          ### 安装与兼容
          - 下载 `MyTodo-Setup-$version.exe` 后按向导安装即可。
          - 升级会保留现有任务与设置；安装器会提示先关闭正在运行的 MyTodo。

          ### 已知提示
          - 安装包暂未进行代码签名，Windows 可能显示“未知发布者”提示。
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP "mytodo-release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          $releaseExists = gh release view $tag --json id --jq .id 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
            gh release edit $tag --title "MyTodo $version" --notes-file $notesPath
          } else {
            gh release create $tag $assets --verify-tag --title "MyTodo $version" --notes-file $notesPath
          }
