name: Publish Windows release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag and package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -ne $tagVersion) {
            throw "Tag ${{ github.ref_name }} does not match package version $version"
          }

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build Windows installer
        run: npm run build:win

      - name: Verify release files
        run: npm run verify:release

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "${{ github.ref_name }}"
          $asset = "dist/MyTodo-Setup-$version.exe"
          $assets = @($asset, "$asset.blockmap", "dist/latest.yml")
          $notes = @"
          ## MyTodo $version

          ### 应用内更新
          - 应用内升级安装器更换为紧凑的 MyTodo 专属界面，直接显示真实安装进度、当前阶段和完成状态。
          - 下载完成后 MyTodo 会自动关闭并原地升级，沿用现有安装范围、安装目录和开机启动设置。
          - 更新完成后点击“完成”即可启动新版，不再重复经过首次安装时的选择步骤。
          - Release 中的 `latest.yml` 和 `.blockmap` 仅供应用自动更新使用，手动安装只需下载 `.exe`。

          ### 多端同步基础
          - 本地任务升级为可同步的数据结构，新增持久化待上传队列、增量同步和断网重试基础能力。
          - 同步账户凭据使用 Windows 安全存储保护，首次上传现有任务前会明确征得确认。
          - 此功能仍处于服务端联调阶段；未配置同步服务时，本地待办与提醒不受影响，可继续离线使用。

          ### 安装与兼容
          - 下载 `MyTodo-Setup-$version.exe` 后按向导安装即可。
          - 升级会保留现有任务、提醒设置、同步队列和数据目录；从外部手动运行安装包时，请先退出正在运行的 MyTodo。

          ### 已知提示
          - 安装包暂未进行代码签名，Windows 可能显示“未知发布者”提示。
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP "mytodo-release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          $releaseExists = gh release view $tag --json id --jq .id 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
            gh release edit $tag --title "MyTodo $version" --notes-file $notesPath
          } else {
            gh release create $tag $assets --verify-tag --title "MyTodo $version" --notes-file $notesPath
          }
