name: Publish Windows release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify tag and package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -ne $tagVersion) {
            throw "Tag ${{ github.ref_name }} does not match package version $version"
          }

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build Windows installer
        run: npm run build:win

      - name: Verify release files
        run: npm run verify:release

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "${{ github.ref_name }}"
          $asset = "dist/MyTodo-Setup-$version.exe"
          $assets = @($asset, "$asset.blockmap", "dist/latest.yml")
          $notes = @"
          ## MyTodo $version

          ### 安装与升级
          - 首次安装更换为 MyTodo 专属界面，从欢迎、安装位置到进度和完成状态保持统一视觉。
          - 发现新版本时可选择“稍后更新”或“立即更新”；下载完成后直接进入紧凑升级进度，无需重复选择安装位置。
          - 手动安装会识别当前版本：相同版本无需重复安装，较旧安装包不会覆盖新版本。
          - 如果 MyTodo 仍在运行，安装器会提示先关闭应用；安装期间也不会允许重复启动应用。
          - 安装与升级窗口使用圆角、细灰边和柔和阴影，窗口大小固定，不会误触缩放。
          - Release 中的 `latest.yml` 和 `.blockmap` 仅供应用自动更新使用，手动安装只需下载 `.exe`。

          ### 数据与兼容
          - 下载 `MyTodo-Setup-$version.exe` 后按向导安装即可。
          - 升级会保留现有任务、提醒设置、同步队列和数据目录；从外部手动运行安装包时，请先退出正在运行的 MyTodo。

          ### 已知提示
          - 安装包暂未进行代码签名，Windows 可能显示“未知发布者”提示。
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP "mytodo-release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          $releaseExists = gh release view $tag --json id --jq .id 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
            gh release edit $tag --title "MyTodo $version" --notes-file $notesPath
          } else {
            gh release create $tag $assets --verify-tag --title "MyTodo $version" --notes-file $notesPath
          }
