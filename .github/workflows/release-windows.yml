name: Publish Windows release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag and package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -ne $tagVersion) {
            throw "Tag ${{ github.ref_name }} does not match package version $version"
          }

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build Windows installer
        run: npm run build:win

      - name: Verify release files
        run: npm run verify:release

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "${{ github.ref_name }}"
          $asset = "dist/MyTodo-Setup-$version.exe"
          $assets = @($asset, "$asset.blockmap", "dist/latest.yml")
          $notes = @"
          ## MyTodo $version

          ### 提醒体验
          - 设置中新增提醒弹窗位置，可在右下角与顶部居中之间切换，并会保存你的选择。
          - 顶部提醒采用更宽、更紧凑的横向布局；两种位置都使用不透明信息面板，阅读更清晰。
          - 提醒窗改用与主应用一致的 Electron 原生阴影，并缩小与屏幕边缘的距离。
          - 无操作自动延后倒计时由 5 秒延长到 15 秒，留出更充足的阅读和操作时间。

          ### 应用内更新
          - 发现新版本后，点击“下载并安装”即可完成后续升级流程。
          - 下载完成后 MyTodo 会自动关闭，并直接启动精简的原地升级安装器。
          - 原地升级沿用现有安装目录，不再重复询问版本、安装位置和开机启动选项。
          - 下载期间会显示完成百分比、实时速度和进度条。
          - Release 中的 `latest.yml` 和 `.blockmap` 仅供应用自动更新使用，手动安装只需下载 `.exe`。

          ### 安装与兼容
          - 下载 `MyTodo-Setup-$version.exe` 后按向导安装即可。
          - 升级会保留现有任务、提醒设置和数据目录；从外部手动运行安装包时，请先退出正在运行的 MyTodo。

          ### 已知提示
          - 安装包暂未进行代码签名，Windows 可能显示“未知发布者”提示。
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP "mytodo-release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          $releaseExists = gh release view $tag --json id --jq .id 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
            gh release edit $tag --title "MyTodo $version" --notes-file $notesPath
          } else {
            gh release create $tag $assets --verify-tag --title "MyTodo $version" --notes-file $notesPath
          }
