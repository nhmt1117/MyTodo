name: Publish Windows release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag and package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version $version"
          }

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build Windows installer
        run: npm run build:win

      - name: Verify release files
        run: npm run verify:release

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "${{ github.ref_name }}"
          $asset = "dist/MyTodo-Setup-$version.exe"
          $notes = @"
          ## MyTodo $version

          ### 本次更新
          - 提醒窗增加“本次不再提醒”：跳过当前这一次提醒，不会关闭该任务后续的提醒。
          - 改进从托盘退出和重新打开应用的稳定性。
          - 安装时的开机启动选项改为更容易理解的中文说明。

          ### 安装与兼容
          - 下载 `MyTodo-Setup-$version.exe` 后按向导安装即可。
          - 从 2.0.0 升级时会保留现有任务与设置；安装器会提示先关闭正在运行的 MyTodo。

          ### 使用说明
          - 本次 Release 仅提供 Windows 安装包；应用内自动更新暂不可用，请在后续版本发布后手动下载新的安装包。
          - 安装包暂未进行代码签名，Windows 可能显示“未知发布者”提示。
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP "mytodo-release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          $releaseExists = gh release view $tag --json id --jq .id 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
            gh release edit $tag --title "MyTodo $version" --notes-file $notesPath
          } else {
            gh release create $tag $asset --verify-tag --title "MyTodo $version" --notes-file $notesPath
          }
